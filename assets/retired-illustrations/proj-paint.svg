<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A house exterior mid-repaint: one half fresh, drop cloths and paint cans below">
  <rect width="800" height="600" fill="#e8e2d9"/>
  <circle cx="150" cy="110" r="50" fill="#f9f5f1"/>
  <rect y="430" width="800" height="170" fill="#d1cbc1"/>

  <!-- house facade -->
  <g stroke="#0b3150" stroke-width="6" stroke-linejoin="round">
    <rect x="220" y="240" width="360" height="190" fill="#fcfaf8"/>
    <path d="M200 240 L400 120 L600 240 Z" fill="#627885"/>
    <!-- freshly painted half (slightly deeper tone) -->
    <path d="M400 240 L580 240 L580 430 L400 430 Z" fill="#bcccd7"/>
    <rect x="255" y="290" width="56 " height="66" fill="#bcccd7"/>
    <path d="M255 323 L311 323 M283 290 L283 356" stroke-width="4"/>
    <rect x="470" y="290" width="56" height="66" fill="#fcfaf8"/>
    <path d="M470 323 L526 323 M498 290 L498 356" stroke-width="4"/>
    <rect x="370" y="330" width="60" height="100" fill="#54708b"/>
  </g>

  <!-- roller on extension pole, resting -->
  <g stroke="#0b3150" stroke-width="5" fill="none">
    <path d="M630 430 L560 250"/>
    <rect x="540" y="228" width="44" height="20" rx="10" fill="#54708b"/>
  </g>

  <!-- drop cloth -->
  <path d="M240 430 Q320 414 400 430 Q480 446 560 430 L560 470 Q400 486 240 470 Z" fill="#f9f5f1" stroke="#0b3150" stroke-width="4" stroke-linejoin="round"/>

  <!-- paint cans -->
  <g stroke="#0b3150" stroke-width="4">
    <rect x="300" y="478" width="36" height="34" fill="#627885"/>
    <path d="M300 486 Q318 476 336 486" fill="none"/>
    <rect x="350" y="484" width="30" height="28" fill="#bcccd7"/>
    <path d="M350 490 Q365 482 380 490" fill="none"/>
  </g>
  <!-- brush -->
  <g stroke="#0b3150" stroke-width="4">
    <rect x="420" y="492" width="14" height="30" fill="#d1cbc1"/>
    <rect x="416" y="478" width="22" height="16" fill="#54708b"/>
  </g>

  <g stroke="#0b3150" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M620 150 Q632 138 644 150 Q656 138 668 150"/>
  </g>
</svg>
