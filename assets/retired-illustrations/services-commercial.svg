<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A tidy storefront with a striped awning, a new sign, and clean display windows">
  <defs>
    <linearGradient id="sky-commercial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcccd7"/>
      <stop offset="1" stop-color="#f9f5f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky-commercial)"/>
  <circle cx="706" cy="96" r="48" fill="#f9f5f1"/>
  <rect y="440" width="800" height="160" fill="#d1cbc1"/>

  <!-- facade -->
  <g stroke="#0b3150" stroke-width="6" stroke-linejoin="round">
    <rect x="140" y="136" width="480" height="316" fill="#fcfaf8"/>
    <rect x="120" y="110" width="520" height="28" fill="#627885" stroke-width="5"/>
  </g>

  <!-- new sign -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <rect x="210" y="166" width="340" height="54" fill="#54708b"/>
  </g>
  <g fill="#fcfaf8">
    <rect x="240" y="184" width="70" height="16"/>
    <rect x="326" y="184" width="100" height="16"/>
    <rect x="442" y="184" width="56" height="16"/>
  </g>

  <!-- awning with stripes and scalloped edge -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <path d="M200 252 L560 252 L588 306 L172 306 Z" fill="#54708b"/>
  </g>
  <g fill="#fcfaf8">
    <path d="M252 252 L268 306 L296 306 L280 252 Z"/>
    <path d="M332 252 L348 306 L376 306 L360 252 Z"/>
    <path d="M412 252 L428 306 L456 306 L440 252 Z"/>
    <path d="M492 252 L508 306 L536 306 L520 252 Z"/>
  </g>
  <path d="M172 306 Q198 326 224 306 Q250 326 276 306 Q302 326 328 306 Q354 326 380 306 Q406 326 432 306 Q458 326 484 306 Q510 326 536 306 Q562 326 588 306" fill="#54708b" stroke="#0b3150" stroke-width="5" stroke-linejoin="round"/>

  <!-- display windows -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <rect x="170" y="330" width="170" height="118" fill="#bcccd7"/>
    <rect x="420" y="330" width="170" height="118" fill="#bcccd7"/>
    <circle cx="215" cy="362" r="18" fill="#f9f5f1" stroke="none"/>
    <circle cx="465" cy="362" r="18" fill="#f9f5f1" stroke="none"/>
  </g>

  <!-- door and mat -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <rect x="352" y="318" width="56" height="134" fill="#627885"/>
    <circle cx="396" cy="390" r="5" fill="#0b3150" stroke="none"/>
    <rect x="340" y="470" width="80" height="18" fill="#fcfaf8" stroke-width="4"/>
  </g>

  <!-- planters -->
  <g stroke="#0b3150" stroke-width="4" stroke-linejoin="round">
    <circle cx="118" cy="436" r="24" fill="#54708b"/>
    <rect x="98" y="452" width="40" height="34" fill="#627885"/>
    <circle cx="660" cy="436" r="24" fill="#54708b"/>
    <rect x="640" y="452" width="40" height="34" fill="#627885"/>
  </g>

  <g stroke="#0b3150" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M96 80 Q108 68 120 80 Q132 68 144 80"/>
  </g>
</svg>
