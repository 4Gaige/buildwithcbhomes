<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A renovated bathroom with a freestanding tub, tiled surround, and a wood vanity">
  <rect width="800" height="600" fill="#f9f5f1"/>
  <rect y="470" width="800" height="130" fill="#e8e2d9"/>

  <!-- tiled tub surround -->
  <g stroke-linejoin="round">
    <rect x="90" y="250" width="390" height="220" fill="#bcccd7" stroke="#0b3150" stroke-width="5"/>
    <path d="M168 250 L168 470 M246 250 L246 470 M324 250 L324 470 M402 250 L402 470" stroke="#f9f5f1" stroke-width="3" fill="none"/>
    <path d="M90 305 L480 305 M90 360 L480 360 M90 415 L480 415" stroke="#f9f5f1" stroke-width="3" fill="none"/>
  </g>

  <!-- window above the tub -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <rect x="200" y="110" width="140" height="100" fill="#bcccd7"/>
    <path d="M270 110 L270 210" stroke-width="4" fill="none"/>
    <circle cx="238" cy="146" r="16" fill="#f9f5f1" stroke="none"/>
  </g>

  <!-- freestanding tub -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <path d="M110 380 L450 380 L450 396 Q450 470 376 470 L184 470 Q110 470 110 396 Z" fill="#fcfaf8"/>
  </g>
  <g fill="#627885" stroke="#0b3150" stroke-width="4" stroke-linejoin="round">
    <path d="M146 470 L142 494 L166 494 L162 470 Z"/>
    <path d="M398 470 L394 494 L418 494 L414 470 Z"/>
  </g>
  <!-- floor-mounted tub filler -->
  <g stroke="#0b3150" stroke-width="5" fill="none" stroke-linejoin="round">
    <path d="M486 470 L486 350 Q486 336 472 336 L452 336"/>
    <circle cx="486" cy="412" r="7" fill="#fcfaf8"/>
  </g>

  <!-- towel bar -->
  <g stroke="#0b3150" stroke-width="4" stroke-linejoin="round">
    <path d="M28 296 L92 296" stroke-width="5" fill="none"/>
    <rect x="40" y="296" width="40" height="74" fill="#54708b"/>
  </g>

  <!-- vanity with mirror -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <rect x="580" y="140" width="120" height="160" fill="#bcccd7"/>
    <circle cx="614" cy="182" r="14" fill="#f9f5f1" stroke="none"/>
    <rect x="530" y="344" width="210" height="16" fill="#fcfaf8"/>
    <rect x="542" y="360" width="186" height="110" fill="#627885"/>
    <path d="M635 360 L635 470" stroke-width="4" fill="none"/>
    <circle cx="620" cy="414" r="4" fill="#f9f5f1" stroke="none"/>
    <circle cx="650" cy="414" r="4" fill="#f9f5f1" stroke="none"/>
  </g>
  <!-- vanity faucet -->
  <g stroke="#0b3150" stroke-width="5" fill="none" stroke-linejoin="round">
    <path d="M636 344 L636 318 Q636 306 648 306 L660 306"/>
  </g>
  <!-- small plant on the counter -->
  <g stroke="#0b3150" stroke-width="4" stroke-linejoin="round">
    <circle cx="706" cy="314" r="16" fill="#627885"/>
    <rect x="696" y="330" width="20" height="14" fill="#d1cbc1"/>
  </g>

  <!-- bath mat -->
  <g stroke="#0b3150" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="280" cy="532" rx="96" ry="16" fill="#fcfaf8"/>
    <ellipse cx="280" cy="532" rx="68" ry="9" fill="none" stroke="#bcccd7" stroke-width="3"/>
  </g>
</svg>
