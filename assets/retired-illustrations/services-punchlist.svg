<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A punch-list checklist hanging on a wall beside a level and a closed toolbox">
  <rect width="800" height="600" fill="#f9f5f1"/>
  <rect y="470" width="800" height="130" fill="#e8e2d9"/>
  <rect y="456" width="800" height="14" fill="#fcfaf8" stroke="#0b3150" stroke-width="4"/>

  <!-- checklist clipboard on the wall -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <circle cx="205" cy="96" r="6" fill="none" stroke-width="4"/>
    <rect x="110" y="116" width="190" height="250" fill="#fcfaf8"/>
    <rect x="180" y="104" width="50" height="24" fill="#627885"/>
  </g>
  <g stroke="#0b3150" stroke-width="4" fill="#fcfaf8">
    <rect x="134" y="160" width="22" height="22"/>
    <rect x="134" y="210" width="22" height="22"/>
    <rect x="134" y="260" width="22" height="22"/>
    <rect x="134" y="310" width="22" height="22"/>
  </g>
  <g fill="#bcccd7">
    <rect x="170" y="167" width="104" height="8"/>
    <rect x="170" y="217" width="88" height="8"/>
    <rect x="170" y="267" width="98" height="8"/>
    <rect x="170" y="317" width="80" height="8"/>
  </g>
  <g stroke="#54708b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M138 171 L145 179 L156 163"/>
    <path d="M138 221 L145 229 L156 213"/>
    <path d="M138 271 L145 279 L156 263"/>
  </g>

  <!-- level leaning against the wall -->
  <g transform="rotate(18 360 540)" stroke="#0b3150" stroke-linejoin="round">
    <rect x="345" y="175" width="30" height="370" fill="#fcfaf8" stroke-width="5"/>
    <rect x="345" y="340" width="30" height="44" fill="#bcccd7" stroke-width="4"/>
    <circle cx="360" cy="362" r="7" fill="#fcfaf8" stroke-width="4"/>
  </g>

  <!-- toolbox on the floor -->
  <g stroke="#0b3150" stroke-width="5" stroke-linejoin="round">
    <path d="M570 428 L570 398 Q605 382 640 398 L640 428" fill="none"/>
    <rect x="500" y="452" width="210" height="98" fill="#627885"/>
    <rect x="490" y="428" width="230" height="26" fill="#54708b"/>
    <rect x="590" y="452" width="30" height="18" fill="#fcfaf8" stroke-width="4"/>
  </g>

  <!-- tape measure -->
  <g stroke="#0b3150" stroke-width="4">
    <rect x="172" y="536" width="26" height="10" fill="#fcfaf8"/>
    <circle cx="150" cy="530" r="22" fill="#54708b"/>
    <circle cx="150" cy="530" r="6" fill="#f9f5f1"/>
  </g>
</svg>
